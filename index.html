<!-- ── App ────────────────────────────────────── -->
<script type="text/babel">
const {useState, useEffect} = React;

// ── CONFIGURE TEAM HERE ──────────────────────────

// role: 'abdm' = field member | 'bdm' = manager | 'gm' = GM (sees all)

// ── DATA CONSTANTS ───────────────────────────────
const TATA_D  = ["Tata.ev S-14, Gurgaon","Tata.ev S-47, Gurgaon","Sagar Sec 63, Noida","Sagar Sec 5, Noida","Sagar Gaur City, Noida","Frontier Dwarka S-20","Jasper Safdarjung","Cherish Rohini","Autovikas Wazirpur","Sagar Greater Noida","Sagar Patparganj","Sagar Dilshad Garden"];
const NT_D    = ["BYD Moti Nagar","Koncept Sec-2, Noida"];
const ALL_D   = ["",...TATA_D,...NT_D,"Other"];
const PURPOSES= ["","Training","Meeting","Objection Handling","Feedback Collection","Incentive Disbursement","Lead Review","Other"];
const DESIG   = ["","GM","SM","TL","CA","Other"];
const VSTATUS = ["","Done","Pending","Cancelled"];
const TOOLS   = [
  {id:'gst', name:'Ground Sales Input Tool',         hint:'Daily lead entries — CRM / ground tool'},
  {id:'lsu', name:'Lead Status Update',              hint:'P90 / P50 / NI / DNP status for all leads'},
  {id:'tt',  name:'Training Tool',                   hint:"Log today's training session record"},
  {id:'cps', name:'Customer Profiling Survey Tool',  hint:'Profile for newly onboarded customers'},
  {id:'sbd', name:'Sales cum BD Engagement Tool',    hint:'BD activity + sales engagement log'},
  {id:'dft', name:'Delivery Forecast Tool',          hint:'Update expected delivery forecast'},
  {id:'dti', name:'Dealership Team Incentive',       hint:'Update incentive disbursement if applicable'},
];
const N='#222E53', T='#00B5AD', P='#F3688D';

const mkV = () => ({dealer:'',time:'',meetWith:'',desig:'',purpose:'',agenda:'',status:''});
const mkF = () => ({
  date: new Date().toISOString().split('T')[0],
  visits: Array(5).fill(0).map(mkV),
  tools: Object.fromEntries(TOOLS.map(t=>[t.id,''])),
  trainings:'', totalLeads:'', enqLeads:'', leadQuality:'',
  p90today:'', p90value:'', enrollForms:'', mtdRevenue:'',
  p50:'', dnp:'', ni:'', p90long:'', handTotal:'',
  insight:'', escalation:'', bdmRemark:'', status:'draft',
});

// ── FIREBASE STORAGE ─────────────────────────────
const RK = (uid, date) => `${uid}_${date}`;

const saveRpt = async (uid, name, data) => {
  const payload = {...data, memberName:name, memberId:uid, savedAt:new Date().toISOString()};
  await db.collection('reports').doc(RK(uid, data.date)).set(payload);
  return payload;
};
const loadRpt = async (uid, date) => {
  try {
    const snap = await db.collection('reports').doc(RK(uid,date)).get();
    return snap.exists ? snap.data() : null;
  } catch(e) { console.error(e); return null; }
};
const listOwn = async (uid) => {
  try {
    const snap = await db.collection('reports').where('memberId','==',uid).get();
    return snap.docs.map(d=>({key:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date));
  } catch(e) { console.error(e); return []; }
};
const listAll = async () => {
  try {
    const snap = await db.collection('reports').get();
    return snap.docs.map(d=>({key:d.id,...d.data()})).sort((a,b)=>b.date.localeCompare(a.date));
  } catch(e) { console.error(e); return []; }
};
const saveRemark = async (uid, date, remark) => {
  const ex = await loadRpt(uid, date);
  if (!ex) return;
  await saveRpt(uid, ex.memberName, {...ex, bdmRemark:remark});
};

// ── UI ATOMS ─────────────────────────────────────
const Inp = ({label,value,onChange,type='text',hint,ph}) => (
  <div style={{marginBottom:12}}>
    {label && <label style={{fontSize:11,fontWeight:700,color:N,display:'block',marginBottom:4,textTransform:'uppercase',letterSpacing:.4}}>{label}</label>}
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={ph||''}
      style={{width:'100%',padding:'8px 11px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:13,outline:'none'}}
      onFocus={e=>e.target.style.borderColor=T} onBlur={e=>e.target.style.borderColor='#CBD5E1'}/>
    {hint && <div style={{fontSize:10,color:'#9CA3AF',marginTop:3,fontStyle:'italic'}}>{hint}</div>}
  </div>
);
const Sel = ({label,value,onChange,options}) => (
  <div style={{marginBottom:12}}>
    {label && <label style={{fontSize:11,fontWeight:700,color:N,display:'block',marginBottom:4,textTransform:'uppercase',letterSpacing:.4}}>{label}</label>}
    <select value={value} onChange={e=>onChange(e.target.value)} style={{width:'100%',padding:'8px 11px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:13,background:'white',outline:'none'}}>
      {options.map(o=><option key={o} value={o}>{o||'— Select —'}</option>)}
    </select>
  </div>
);
const Txt = ({label,value,onChange,rows=3,hint}) => (
  <div style={{marginBottom:12}}>
    {label && <label style={{fontSize:11,fontWeight:700,color:N,display:'block',marginBottom:4,textTransform:'uppercase',letterSpacing:.4}}>{label}</label>}
    <textarea value={value} onChange={e=>onChange(e.target.value)} rows={rows}
      style={{width:'100%',padding:'8px 11px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:13,resize:'vertical',outline:'none'}}
      onFocus={e=>e.target.style.borderColor=T} onBlur={e=>e.target.style.borderColor='#CBD5E1'}/>
    {hint && <div style={{fontSize:10,color:'#9CA3AF',marginTop:3,fontStyle:'italic'}}>{hint}</div>}
  </div>
);
const Badge = ({status}) => {
  const c = status==='submitted' ? {bg:'#D1FAE5',tc:'#065F46'} : {bg:'#FEF3C7',tc:'#92400E'};
  return <span style={{fontSize:11,fontWeight:700,padding:'2px 9px',borderRadius:20,background:c.bg,color:c.tc}}>{status==='submitted'?'Submitted':'Draft'}</span>;
};
const Btn = ({children,onClick,v='primary',sm,disabled}) => {
  const s={primary:{background:N,color:'white',border:`2px solid ${N}`},secondary:{background:'white',color:N,border:`2px solid ${N}`},teal:{background:T,color:'white',border:`2px solid ${T}`},ghost:{background:'transparent',color:'#6B7280',border:'1.5px solid #E2E8F0'}};
  return <button onClick={onClick} disabled={disabled} style={{...s[v],padding:sm?'6px 13px':'9px 18px',borderRadius:7,fontWeight:700,fontSize:sm?12:13,cursor:disabled?'not-allowed':'pointer',opacity:disabled?.5:1}}>{children}</button>;
};
const Card = ({code,title,sub,color,children}) => (
  <div style={{background:'white',border:'1px solid #E2E8F0',borderRadius:10,marginBottom:18,overflow:'hidden'}}>
    <div style={{background:color||N,padding:'9px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:9}}>
        <span style={{background:'rgba(255,255,255,.2)',color:'white',fontWeight:900,fontSize:11,padding:'1px 7px',borderRadius:3}}>{code}</span>
        <span style={{color:'white',fontWeight:700,fontSize:13}}>{title}</span>
      </div>
      {sub && <span style={{color:'rgba(255,255,255,.7)',fontSize:11}}>{sub}</span>}
    </div>
    <div style={{padding:16}}>{children}</div>
  </div>
);
const Nav = ({user,uid,onLogout,title}) => (
  <div style={{background:N,padding:'11px 22px',display:'flex',alignItems:'center',justifyContent:'space-between',position:'sticky',top:0,zIndex:100,boxShadow:'0 2px 10px rgba(0,0,0,.15)'}}>
    <div>
      <div style={{fontSize:14,fontWeight:800,color:'white'}}>Hopcharge · Field Report</div>
      <div style={{fontSize:10,color:'rgba(255,255,255,.4)'}}>{title} · {uid}</div>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10}}>
      <div style={{textAlign:'right'}}><div style={{fontSize:13,fontWeight:700,color:'white'}}>{user.name}</div><div style={{fontSize:10,color:'rgba(255,255,255,.4)'}}>{user.role.toUpperCase()}</div></div>
      <button onClick={onLogout} style={{padding:'5px 13px',background:'rgba(255,255,255,.1)',color:'white',border:'1px solid rgba(255,255,255,.2)',borderRadius:6,fontSize:12,cursor:'pointer'}}>Sign Out</button>
    </div>
  </div>
);
const Spinner = () => <div style={{display:'flex',justifyContent:'center',padding:40}}><div style={{width:28,height:28,border:'3px solid #E2E8F0',borderTopColor:T,borderRadius:'50%',animation:'spin 1s linear infinite'}}></div></div>;

// ── LOGIN ────────────────────────────────────────

        <div style={{background:N,padding:'28px 30px 20px',textAlign:'center'}}>
          <div style={{width:52,height:52,background:'rgba(255,255,255,.1)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',fontSize:24}}>⚡</div>
          <div style={{fontSize:20,fontWeight:800,color:'white'}}>Daily Field Report</div>
          <div style={{fontSize:12,color:'rgba(255,255,255,.45)',marginTop:4}}>ABDM · NCR Ground Sales · Hopcharge</div>
        </div>
        <div style={{padding:'28px 30px'}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:11,fontWeight:700,color:N,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.4}}>Member ID</label>
            <input value={id} onChange={e=>setId(e.target.value)} placeholder="e.g. ABDM01" onKeyDown={e=>e.key==='Enter'&&go()}
              style={{width:'100%',padding:'10px 14px',border:'1.5px solid #CBD5E1',borderRadius:7,fontSize:14,outline:'none'}}/>
          </div>
          <div style={{marginBottom:18}}>
            <label style={{fontSize:11,fontWeight:700,color:N,display:'block',marginBottom:5,textTransform:'uppercase',letterSpacing:.4}}>Password</label>

          </div>
          {err && <div style={{fontSize:12,color:P,marginBottom:12,padding:'8px 12px',background:'#FEF0F4',borderRadius:6,fontWeight:600}}>{err}</div>}
          <button onClick={go} style={{width:'100%',padding:12,background:N,color:'white',border:'none',borderRadius:8,fontSize:14,fontWeight:700,cursor:'pointer',marginBottom:16}}>Sign In →</button>
          <div style={{padding:12,background:'#F0F4F8',borderRadius:8,fontSize:11,color:'#64748B',lineHeight:1.8}}>
            <strong style={{color:N}}>Login Credentials</strong><br/>
            ABDM01 / tarun@123 &nbsp;·&nbsp; ABDM02 / anoop@123<br/>
            BDM01 / bdm@123 &nbsp;·&nbsp; GM01 / gm@123
          </div>
        </div>
      </div>

}

// ── FORM STEPS ───────────────────────────────────
function StepVisits({form,setForm}) {

        ★ Fill plan before 11 AM · Take photo · Share on WhatsApp team group
      </div>
      {form.visits.map((v,i) => (
        <div key={i} style={{border:'1px solid #E2E8F0',borderRadius:8,padding:14,marginBottom:10,background:i%2?'#FAFBFC':'white'}}>
          <div style={{fontSize:11,fontWeight:800,color:T,marginBottom:10}}>VISIT {i+1}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 14px'}}>
            <Sel label="Dealership" value={v.dealer} onChange={val=>updV(i,'dealer',val)} options={ALL_D}/>
            <Inp label="Visit Time" value={v.time} onChange={val=>updV(i,'time',val)} ph="e.g. 10:00 AM – 12:00 PM"/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'0 14px'}}>
            <Inp label="Meet With" value={v.meetWith} onChange={val=>updV(i,'meetWith',val)} ph="Name"/>
            <Sel label="Designation" value={v.desig} onChange={val=>updV(i,'desig',val)} options={DESIG}/>
            <Sel label="Purpose" value={v.purpose} onChange={val=>updV(i,'purpose',val)} options={PURPOSES}/>

function StepTools({form,setForm}) {
  const updT = (id,v) => setForm(p=>({...p,tools:{...p.tools,[id]:v}}));
  const filled = Object.values(form.tools).filter(Boolean).length;
  return (
    <Card code="B" title="Tool Compliance Tracker" sub={`${filled}/7 marked`} color={P}>
      <div style={{fontSize:11,color:'#6B7280',marginBottom:14}}>Mark YES / NO / NA for each tool before 7:00 PM</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {TOOLS.map(t => (
          <div key={t.id} style={{padding:'11px 14px',border:'1px solid #E2E8F0',borderRadius:8,display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,background:form.tools[t.id]?'#F7FFFE':'white'}}>
            <div><div style={{fontSize:12,fontWeight:700,color:N}}>{t.name}</div><div style={{fontSize:10,color:'#9CA3AF',fontStyle:'italic',marginTop:2}}>{t.hint}</div></div>
            <div style={{display:'flex',gap:5,flexShrink:0}}>
              {['YES','NO','NA'].map(o=>(
                <button key={o} onClick={()=>updT(t.id,o)} style={{padding:'4px 9px',borderRadius:5,border:`1.5px solid ${form.tools[t.id]===o?(o==='YES'?T:o==='NO'?P:'#9CA3AF'):'#CBD5E1'}`,background:form.tools[t.id]===o?(o==='YES'?'#E6FAF9':o==='NO'?'#FEF0F4':'#F3F4F6'):'white',color:form.tools[t.id]===o?(o==='YES'?T:o==='NO'?P:'#6B7280'):'#9CA3AF',fontWeight:700,fontSize:11,cursor:'pointer'}}>
                  {o}
                </button>
              ))}
            </div>
          </div>
        ))}
      </div>
      <div style={{marginTop:14,padding:'10px 14px',background:'#F0F4F8',borderRadius:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontWeight:700,color:N,fontSize:13}}>EOD Compliance Score</span>
        <span style={{fontWeight:800,fontSize:20,color:filled===7?T:filled>=4?'#F59E0B':P}}>{filled} / 7</span>
      </div>
    </Card>
  );
}

        <Inp label="Daily P90 Value / Total Active P90 Value" value={form.p90value} onChange={v=>upd('p90value',v)} hint="e.g. 2×3.3 + 1×Exp / 5×3.3 + 2×Exp"/>
        <Inp label="Enrollment Forms Filled" value={form.enrollForms} onChange={v=>upd('enrollForms',v)} hint="#Customer profile forms"/>

function StepHandover({form,setForm}) {
  const upd = (k,v) => setForm(p=>({...p,[k]:v}));
  const stages = [{k:'p50',l:'P50',s:'Warm, Not Ready'},{k:'dnp',l:'DNP',s:'Did Not Pick'},{k:'ni',l:'NI',s:'Declined'},{k:'p90long',l:'P90 >15d',s:'Long Cycle'},{k:'handTotal',l:'TOTAL',s:'Handed Over',b:true}];
  return (
    <>
      <Card code="D" title="Lead Handover — Inside Sales" sub="P50 / DNP / NI / CMB / P90 >15 Days" color={P}>

          {stages.map(st => (
            <div key={st.k} style={{textAlign:'center',padding:12,border:`2px solid ${st.b?N:'#E2E8F0'}`,borderRadius:8,background:st.b?N:'white'}}>
              <div style={{fontSize:11,fontWeight:800,color:st.b?'white':N,marginBottom:2}}>{st.l}</div>
              <div style={{fontSize:9,color:st.b?'rgba(255,255,255,.4)':'#9CA3AF',marginBottom:8}}>({st.s})</div>
              <input type="number" value={form[st.k]} onChange={e=>upd(st.k,e.target.value)} min={0}

            </div>
          ))}
        </div>
      </Card>
      <Card code="E" title="Insight / Observation / Escalation" color={N}>
        <Txt label="Insight of the Day" value={form.insight} onChange={v=>upd('insight',v)} rows={3} hint="Competitor activity / dealer feedback / ground observation / new learning"/>
        <Txt label="Escalation / Blocker (Flag for BDM)" value={form.escalation} onChange={v=>upd('escalation',v)} rows={2} hint="Requires BDM attention"/>
      </Card>
    </>
  );
}

// ── FORM WRAPPER ─────────────────────────────────
function FormView({userId,user,init,onBack,onSubmit}) {
  const [form,setForm] = useState(init||mkF());
  const [step,setStep] = useState(1);
  const [saving,setSaving] = useState(false);
  const [toast,setToast] = useState('');
  const steps = ['Visit Plan','Tool Compliance','Sales Metrics','Handover & Insight'];

  const showToast = (msg) => { setToast(msg); setTimeout(()=>setToast(''),2500); };

  const doSave = async (submit=false) => {
    setSaving(true);
    try {
      const saved = await saveRpt(userId, user.name, {...form, status:submit?'submitted':'draft'});
      showToast(submit?'✓ Report submitted successfully!':'Draft saved.');
      if (submit) setTimeout(()=>onSubmit(saved), 700);
    } catch(e) {
      showToast('Error saving — check your connection.');
    }
    setSaving(false);
  };

  return (
    <div style={{minHeight:'100vh',background:'#F0F4F8'}}>
      <Nav user={user} uid={userId} onLogout={()=>{}} title="Filing Report"/>
      {/* Top bar */}
      <div style={{background:'white',borderBottom:'1px solid #E2E8F0',padding:'9px 22px',display:'flex',alignItems:'center',gap:14}}>
        <input type="date" value={form.date} onChange={e=>setForm(p=>({...p,date:e.target.value}))}
          style={{padding:'5px 9px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:13,outline:'none'}}/>
        <div style={{marginLeft:'auto',display:'flex',gap:8}}>
          <Btn v="ghost" sm onClick={onBack}>← Back</Btn>
          <Btn v="secondary" sm onClick={()=>doSave(false)} disabled={saving}>Save Draft</Btn>
        </div>
      </div>
      {/* Steps */}
      <div style={{background:'white',borderBottom:'1px solid #E2E8F0',display:'flex',overflowX:'auto'}}>
        {steps.map((s,i) => (
          <button key={i} onClick={()=>setStep(i+1)} style={{padding:'10px 16px',border:'none',background:'transparent',fontSize:12,fontWeight:step===i+1?800:500,color:step===i+1?T:'#6B7280',cursor:'pointer',borderBottom:step===i+1?`2.5px solid ${T}`:'2.5px solid transparent',whiteSpace:'nowrap',flexShrink:0}}>
            <span style={{marginRight:5,fontSize:10,background:step===i+1?T:'#CBD5E1',color:'white',borderRadius:20,padding:'1px 6px',fontWeight:800}}>{i+1}</span>{s}
          </button>
        ))}
      </div>
      {/* Toast */}
      {toast && (
        <div style={{background:toast.includes('✓')?'#D1FAE5':toast.includes('Error')?'#FEE2E2':'#FEF3C7',color:toast.includes('✓')?'#065F46':toast.includes('Error')?'#991B1B':'#92400E',padding:'10px 22px',fontSize:13,fontWeight:700}}>{toast}</div>
      )}
      {/* Form content */}
      <div style={{maxWidth:940,margin:'0 auto',padding:'20px 16px'}}>
        {step===1 && <StepVisits form={form} setForm={setForm}/>}
        {step===2 && <StepTools form={form} setForm={setForm}/>}
        {step===3 && <StepSales form={form} setForm={setForm}/>}
        {step===4 && <StepHandover form={form} setForm={setForm}/>}
        <div style={{display:'flex',justifyContent:'space-between',marginTop:4,paddingBottom:24}}>
          <div>{step>1 && <Btn v="secondary" onClick={()=>setStep(s=>s-1)}>← Previous</Btn>}</div>
          <div style={{display:'flex',gap:8}}>
            {step<4 && <Btn v="teal" onClick={()=>setStep(s=>s+1)}>Next →</Btn>}
            {step===4 && <Btn v="teal" onClick={()=>doSave(true)} disabled={saving}>{saving?'Submitting…':'Submit Report ✓'}</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
}

                  <div>
                    <div style={{fontSize:14,fontWeight:800,color:N}}>{USERS[mid]?.name}</div>
                    <div style={{fontSize:11,color:'#9CA3AF'}}>{mid}</div>
                  </div>
                  <div style={{display:'flex',alignItems:'center',gap:9}}>
                    {r ? <><Badge status={r.status}/><button onClick={()=>onView(mid,today)} style={{padding:'5px 11px',background:N,color:'white',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',fontWeight:700}}>View →</button></> :
                    <span style={{fontSize:12,color:'#9CA3AF'}}>Not filed yet</span>}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
        {/* All reports */}
        <div style={{background:'white',borderRadius:12,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,.06)'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14,flexWrap:'wrap',gap:10}}>
            <div style={{fontSize:14,fontWeight:800,color:N}}>All Reports</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input type="date" value={df} onChange={e=>setDf(e.target.value)} style={{padding:'6px 10px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:12,outline:'none'}}/>
              <select value={mf} onChange={e=>setMf(e.target.value)} style={{padding:'6px 10px',border:'1.5px solid #CBD5E1',borderRadius:6,fontSize:12,background:'white',outline:'none'}}>
                <option value="">All Members</option>
                {MEMBER_IDS.map(m=><option key={m} value={m}>{USERS[m]?.name} ({m})</option>)}
              </select>
              {(df||mf) && <button onClick={()=>{setDf('');setMf('');}} style={{padding:'6px 11px',background:'#F3F4F6',border:'none',borderRadius:6,fontSize:12,cursor:'pointer',color:'#6B7280'}}>Clear ×</button>}
              <button onClick={()=>listAll().then(r=>setRpts(r))} style={{padding:'6px 11px',background:'#F0F4F8',border:'1px solid #E2E8F0',borderRadius:6,fontSize:12,cursor:'pointer',color:N,fontWeight:700}}>↻ Refresh</button>
            </div>
          </div>
          {loading ? <Spinner/> : filtered.length===0 ?
            <div style={{color:'#9CA3AF',fontSize:13,textAlign:'center',padding:24}}>No reports found.</div> :
            filtered.map(r => (
              <div key={r.key} onClick={()=>onView(r.memberId,r.date)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 14px',borderRadius:8,border:'1px solid #E2E8F0',marginBottom:7,cursor:'pointer'}}
                onMouseEnter={e=>e.currentTarget.style.background='#F7F8FC'} onMouseLeave={e=>e.currentTarget.style.background='white'}>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:N}}>{r.memberName} <span style={{fontSize:11,color:'#9CA3AF',fontWeight:400}}>({r.memberId})</span></div>
                  <div style={{fontSize:10,color:'#9CA3AF',marginTop:2}}>{new Date(r.date+'T12:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>
                </div>
                <div style={{display:'flex',alignItems:'center',gap:10}}><Badge status={r.status}/><span style={{color:'#CBD5E1',fontSize:18}}>›</span></div>
              </div>
            ))
          }
        </div>
      </div>
    </div>
  );
}

// ── MAIN APP ─────────────────────────────────────
function App() {
  const [user,setUser] = useState(null);
  const [uid,setUid] = useState('');
  const [view,setView] = useState('login');
  const [ctx,setCtx] = useState(null);

  const login = (id,u) => { setUser(u); setUid(id); setView(u.role==='abdm'?'dash':'mgr'); };
  const logout = () => { setUser(null); setUid(''); setView('login'); setCtx(null); };

  const openView = async (mid,date) => {
    const r = await loadRpt(mid,date);
    setCtx({uid:mid,date,report:r});
    setView('preview');
  };
  const openForm = async (date) => {
    const ex = await loadRpt(uid,date);
    setCtx({report: ex||{...mkF(),date}});
    setView('form');
  };

  if (view==='login') return <Login onLogin={login}/>;
  if (view==='form' && ctx) return <FormView userId={uid} user={user} init={ctx.report} onBack={()=>setView('dash')} onSubmit={()=>setView('dash')}/>;
  if (view==='preview' && ctx) return <Preview report={ctx.report} userId={uid} user={user} canAddRemark={user?.role!=='abdm'} onBack={()=>setView(user?.role==='abdm'?'dash':'mgr')}/>;
  if (view==='dash') return <Dashboard user={user} uid={uid} onLogout={logout} onNew={openForm} onView={openView}/>;
  if (view==='mgr') return <Manager user={user} uid={uid} onLogout={logout} onView={openView}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
