// ═══════════════════════════════════════════════════════
// PRINT REPORT FUNCTION
// ═══════════════════════════════════════════════════════
function buildPrintHTML(plan, eod, bdmM, bdmE, title) {
  const V = x => x || '—';
  const rv = (val, other) => val === 'Other' && other ? other : val;
  const TOOL_NAMES = {
    gst: 'Ground Sales Input Tool',
    lsu: 'Lead Status Update',
    tt: 'Training Tool',
    cps: 'Customer Profiling Survey Tool',
    sbd: 'Sales cum BD Engagement Tool',
    dft: 'Delivery Forecast Tool',
    dti: 'Dealership Team Incentive'
  };
  const css = `
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;font-size:10px;color:#1a1a2e;background:white;padding:10mm}
    h1{font-size:13px;font-weight:900;margin-bottom:6px}
    .sub{font-size:10px;color:#555;margin-bottom:10px;border-bottom:1.5px solid #1a1a2e;padding-bottom:6px}
    .sec{margin-bottom:10px;border:1px solid #555;border-radius:3px;overflow:hidden}
    .sh{background:#1a1a2e;color:white;padding:5px 10px;font-size:9.5px;font-weight:800}
    .sb{padding:9px}
    table{width:100%;border-collapse:collapse;font-size:9px}
    th,td{border:1px solid #999;padding:4px 5px;text-align:left;vertical-align:top}
    th{background:#ebebeb;font-weight:800}
    .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .mc{border:1px solid #555;padding:7px;border-radius:2px}
    .ml{font-size:8px;font-weight:800;margin-bottom:4px;color:#555}
    .mv{font-size:15px;font-weight:900;border-top:1px solid #ccc;padding-top:3px;margin-top:2px}
    .tg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
    .ti{border:1px solid #ccc;padding:5px 8px;display:flex;justify-content:space-between;align-items:center}
    .yna{font-weight:800;font-size:12px;padding:2px 8px;border:1px solid #555;border-radius:3px}
    .wl{border:1px solid #ccc;padding:6px;min-height:28px;font-size:10px;border-radius:2px;margin-bottom:8px}
    .rating{font-weight:800;font-size:12px;padding:2px 10px;border-radius:10px;border:1px solid #555;display:inline-block}
    @media print{body{padding:7mm}@page{margin:8mm size:A4 landscape}}
  `;
  let body = `<h1>${title}</h1>`;
  const memberName = (plan || eod || bdmM || bdmE)?.memberName || (plan || eod || bdmM || bdmE)?.bdmName || '';

  body += `<div class="sub">Name: ${memberName} &nbsp;·&nbsp; Date: ${date} &nbsp;·&nbsp; Generated: ${new Date().toLocaleString('en-IN')}</div>`;

  // Section A – Visit Plan
  if (plan) {
    const visits = (plan.visits || []).filter(v => v.dealer);
    body += `<div class="sec"><div class="sh">A · TODAY'S VISIT PLAN</div><div class="sb">`;
    body += `<table><thead><tr><th>#</th><th>Dealership</th><th>Time</th><th>Meet With</th><th>Desig.</th><th>Purpose</th><th>Agenda</th></tr></thead><tbody>`;
    visits.forEach((v, i) => {
      body += `<tr><td>${i + 1}</td><td>${V(rv(v.dealer, v.dealerOther))}</td><td>${V(v.time)}</td><td>${V(v.meetWith)}</td><td>${V(rv(v.desig, v.desigOther))}</td><td>${V(rv(v.purpose, v.purposeOther))}</td><td>${V(v.agenda)}</td></tr>`;

    body += `</tbody></table></div></div>`;

  // EOD Sections B C D E

    Object.entries(TOOL_NAMES).forEach(([id, name]) => {
      const v = (eod.tools || {})[id];

      v: eod.leadQuality

      l: 'P90 Today/Active',
      v: eod.p90today

      l: 'P90 Value',
      v: eod.p90value

      l: 'Enroll Forms',
      v: eod.enrollForms

      l: 'MTD Revenue (₹)',

    // D – Handover

      v: eod.p50

      l: 'DNP',
      s: 'Did Not Pick',
      v: eod.dnp

      l: 'Not Interested',
      s: 'Declined',
      v: eod.ni

      l: 'P90 >15d',
      s: 'Long Cycle',
      v: eod.p90long

      l: 'TOTAL',
      s: 'Handed Over',
      v: eod.handTotal

      body += `<div class="mc" style="text-align:center"><div class="ml">${st.l}</div><div style="font-size:8px;color:#888;margin-bottom:4px">(${st.s})</div><div class="mv">${V(st.v)}</div></div>`;
    });
    body += `</div></div></div>`;
    // E – Insight
    body += `<div class="sec"><div class="sh">E · INSIGHT / OBSERVATION / ESCALATION</div><div class="sb">`;
    body += `<div style="font-size:8.5px;font-weight:800;margin-bottom:3px">INSIGHT OF THE DAY:</div><div class="wl">${V(eod.insight)}</div>`;
    body += `<div style="font-size:8.5px;font-weight:800;margin-bottom:3px">ESCALATION / BLOCKER:</div><div class="wl">${V(eod.escalation)}</div>`;
    body += `<div style="font-size:8.5px;font-weight:800;margin-bottom:3px">BDM REMARK:</div><div class="wl">${V(eod.bdmRemark)}</div>`;
    body += `</div></div>`;

        body += `<div><div style="font-size:9.5px;font-weight:700">${V(rv(v.dealer, v.dealerOther))}</div><div style="font-size:8px;color:#888">${V(rv(v.purpose, v.purposeOther))} · ${V(v.time)}</div></div>`;
        body += `<span style="font-weight:800;font-size:11px;border:1px solid #555;padding:1px 8px;border-radius:10px">${V(st)}</span></div>`;
      });
      body += `</div></div>`;
    }
  }

  // BDM Morning Report
  if (bdmM) {
    body += `<div class="sec"><div class="sh">BM1 · MORNING MEETING</div><div class="sb">`;
    body += `<div class="g2"><div><div class="ml">Meeting Held</div><span class="yna">${V(bdmM.meetingHeld)}</span></div><div><div class="ml">Time</div><div>${V(bdmM.meetingTime)}</div></div></div>`;
    if (bdmM.meetingRemarks) body += `<div style="margin-top:6px"><div class="ml">REMARKS / KEY POINTS</div><div class="wl">${bdmM.meetingRemarks}</div></div>`;
    body += `</div></div>`;
    if (bdmM.tataCallsListened || bdmM.tataPitchFeedback) {
      body += `<div class="sec"><div class="sh">BM2 · TATA TELE PITCH REVIEW</div><div class="sb">`;
      body += `<div class="ml">Calls Listened: ${V(bdmM.tataCallsListened)}</div>`;
      if (bdmM.tataPitchFeedback) body += `<div class="wl" style="margin-top:5px">${bdmM.tataPitchFeedback}</div>`;
      body += `</div></div>`;
    }
    (bdmM.abdmPlanReviews || []).forEach((ar, i) => {
      body += `<div class="sec"><div class="sh">PLAN REVIEW · ${ar.memberName}</div><div class="sb">`;
      body += `<div class="ml">Plan Reviewed: <span class="yna">${V(ar.reviewed)}</span></div>`;
      if (ar.ctaAssigned) body += `<div style="margin-top:6px"><div class="ml">CTA ASSIGNED</div><div class="wl">${ar.ctaAssigned}</div></div>`;
      if (ar.remarks) body += `<div><div class="ml">REMARKS</div><div class="wl">${ar.remarks}</div></div>`;
      if (ar.flags) body += `<div><div class="ml">FLAGS</div><div class="wl">${ar.flags}</div></div>`;
      body += `</div></div>`;
    });
  }

  // BDM EOD Review
  if (bdmE) {
    (bdmE.abdmEodReviews || []).forEach((er, i) => {
      body += `<div class="sec"><div class="sh">EOD REVIEW · ${er.memberName}</div><div class="sb">`;
      body += `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px">`;
      body += `<div><div class="ml">Reviewed</div><span class="yna">${V(er.reviewed)}</span></div>`;
      body += `<div><div class="ml">Completeness</div><span style="font-weight:700;font-size:10px">${V(er.completeness)}</span></div>`;
      body += `<div><div class="ml">Overall Rating</div><span class="rating">${V(er.overallRating)}</span></div></div>`;
      if (er.funnelRemarks) body += `<div><div class="ml">FUNNEL / P90 REMARKS</div><div class="wl">${er.funnelRemarks}</div></div>`;
      if (er.feedbackToAbdm) body += `<div><div class="ml">FEEDBACK TO ABDM</div><div class="wl">${er.feedbackToAbdm}</div></div>`;
      if (er.escalationToGM) body += `<div><div class="ml" style="color:red">ESCALATION TO GM</div><div class="wl">${er.escalationToGM}</div></div>`;
      body += `</div></div>`;
    });
    if (bdmE.objectionsHandled || bdmE.p90PipelineNotes) {
      body += `<div class="sec"><div class="sh">BDM DAY SUMMARY</div><div class="sb">`;
      if (bdmE.objectionsHandled) body += `<div><div class="ml">OBJECTIONS HANDLED</div><div class="wl">${bdmE.objectionsHandled}</div></div>`;
      if (bdmE.p90PipelineNotes) body += `<div><div class="ml">P90 PIPELINE NOTES</div><div class="wl">${bdmE.p90PipelineNotes}</div></div>`;
      body += `</div></div>`;
    }
    if (bdmE.escalationToGM) {
      body += `<div class="sec"><div class="sh" style="background:#c0392b">ESCALATION TO GM</div><div class="sb"><div class="wl">${bdmE.escalationToGM}</div></div></div>`;
    }
    if (bdmE.tomorrowFocus || bdmE.tomorrowCTAs) {
      body += `<div class="sec"><div class="sh">TOMORROW'S PLAN</div><div class="sb">`;
      if (bdmE.tomorrowFocus) body += `<div><div class="ml">FOCUS AREAS</div><div class="wl">${bdmE.tomorrowFocus}</div></div>`;
      if (bdmE.tomorrowCTAs) body += `<div><div class="ml">CTAs FOR TEAM</div><div class="wl">${bdmE.tomorrowCTAs}</div></div>`;
      body += `</div></div>`;
    }
  }
  return `<!DOCTYPE html><html><head><meta charset="utf-8"/><title>${title}</title><style>${css}</style></head><body>${body}</body></html>`;
}
function printReport(plan, eod, bdmM, bdmE, title) {
  const t = title || 'Field Report — ' + ((plan || eod || bdmM || bdmE)?.memberName || '') + ' — ' + ((plan || eod || bdmM || bdmE)?.date || '');
  const w = window.open('', '_blank');
  w.document.write(buildPrintHTML(plan, eod, bdmM, bdmE, t));
  w.document.close();
  setTimeout(() => w.print(), 400);
}
